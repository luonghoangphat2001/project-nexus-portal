name: CI/CD Pipeline - Nexus Portal

on:
  push:
    branches: [ main ]
    paths:
      - 'project-nexus-portal/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'project-nexus-portal/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'project-nexus-portal/be/**'
            frontend:
              - 'project-nexus-portal/fe/**'

  ci-backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-nexus-portal/be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - run: mvn clean test -B

  ci-frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-nexus-portal/fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'project-nexus-portal/fe/package-lock.json'
      - run: npm ci
      - run: npm run build

  cd-deploy:
    name: Deploy to VPS
    needs: [changes, ci-backend, ci-frontend]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (needs.ci-backend.result == 'success' || needs.ci-backend.result == 'skipped') &&
      (needs.ci-frontend.result == 'success' || needs.ci-frontend.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        env:
          SERVICE_TYPE: ${{ (needs.changes.outputs.backend == 'true' && needs.changes.outputs.frontend == 'true') && 'all' || (needs.changes.outputs.backend == 'true' && 'backend') || (needs.changes.outputs.frontend == 'true' && 'frontend') || 'all' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          timeout: 60s
          envs: SERVICE_TYPE
          script: |
            set -e
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
              if [ -d "/root/project-nexus-portal" ]; then
                TARGET_DIR="/root/project-nexus-portal"
              elif [ -d "$HOME/project-nexus-portal" ]; then
                TARGET_DIR="$HOME/project-nexus-portal"
              elif [ -d "/home/ubuntu/project-nexus-portal" ]; then
                TARGET_DIR="/home/ubuntu/project-nexus-portal"
              else
                git clone https://github.com/luonghoangphat2001/project-nexus-portal.git /root/project-nexus-portal
                TARGET_DIR="/root/project-nexus-portal"
              fi
            fi

            echo "Deploying $SERVICE_TYPE to: $TARGET_DIR"

            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ -d "project-nexus-portal" ]; then
              cd project-nexus-portal
            fi

            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh "$SERVICE_TYPE"

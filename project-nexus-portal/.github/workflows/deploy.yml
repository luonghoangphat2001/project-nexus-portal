name: CI/CD Pipeline - Nexus Portal

on:
  push:
    branches: [ main ]
    paths:
      - 'project-nexus-portal/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'project-nexus-portal/**'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-nexus-portal/be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - run: mvn clean test -B

  ci-frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-nexus-portal/fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'project-nexus-portal/fe/package-lock.json'
      - run: npm ci
      - run: npm run build

  cd-deploy:
    name: Deploy to VPS
    needs: [ci-backend, ci-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            TARGET_DIR="${{ secrets.VPS_TARGET_DIR }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="$HOME/project-nexus-portal"
            fi
            TARGET_DIR="${TARGET_DIR/#\~/$HOME}"

            if [ ! -d "$TARGET_DIR" ]; then
              echo "Directory $TARGET_DIR does not exist on VPS."
              exit 1
            fi

            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ -d "project-nexus-portal" ]; then
              cd project-nexus-portal
            fi

            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh

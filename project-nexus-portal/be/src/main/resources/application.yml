server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${CONTEXT_PATH}

spring:
  application:
    name: nexus-portal-backend
  servlet:
    multipart:
      max-file-size: ${REPORT_MAX_FILE_BYTES:10485760}B
      max-request-size: ${REPORT_MAX_REQUEST_BYTES:12582912}B
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO}
    show-sql: ${SHOW_SQL}
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: ${SQL_INIT_MODE}
      encoding: UTF-8
      continue-on-error: true
      data-locations:
        - classpath:data.sql
        - classpath:data/01_roles.sql
        - classpath:data/02_academic_data.sql
        - classpath:data/03_users.sql
        - classpath:data/04_periods_topics.sql
        - classpath:data/05_teams_matchmaking.sql
        - classpath:data/06_notifications_kanban.sql
        - classpath:data/07_councils_assessments_results.sql
        - classpath:data/08_audit_settings.sql
        - classpath:data/09_demo_defense_data.sql
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:true}
          timeout: 5000
          connectiontimeout: 5000
          writetimeout: 5000

app:
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:lhphat.work@gmail.com}}
    frontend-url: ${APP_FRONTEND_URL:${FRONTEND_URL:https://nexusportal.playerhub.io.vn}}
  reports:
    max-file-bytes: ${REPORT_MAX_FILE_BYTES:10485760}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN}
  api:
    prefix: ${API_PREFIX}
    version: ${API_VERSION}
    base-url: ${API_BASE_URL}

springdoc:
  api-docs:
    path: ${SWAGGER_DOCS_PATH}
    enabled: true
  swagger-ui:
    path: ${SWAGGER_UI_PATH}
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    doc-expansion: none

logging:
  file:
    name: ${LOG_FILE:logs/nexus-backend.log}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_PATTERN:logs/nexus-backend-%d{yyyy-MM-dd}.%i.log}
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB



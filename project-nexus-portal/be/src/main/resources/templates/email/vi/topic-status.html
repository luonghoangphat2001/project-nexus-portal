<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b; }
        .wrapper { width: 100%; table-layout: fixed; background-color: #f1f5f9; padding: 32px 16px; }
        .main-card { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); }
        .header { background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); padding: 28px 32px; color: #ffffff; }
        .header-badge { display: inline-block; background-color: rgba(255, 255, 255, 0.2); color: #ffffff; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 9999px; text-transform: uppercase; margin-bottom: 8px; }
        .header-title { margin: 0; font-size: 20px; font-weight: 700; color: #ffffff; }
        .body { padding: 32px; }
        .notice-title { font-size: 17px; font-weight: 700; color: #1e3a8a; margin-bottom: 12px; }
        .content-box { background-color: #eff6ff; border-radius: 12px; border: 1px solid #bfdbfe; border-left: 4px solid #2563eb; padding: 18px 20px; font-size: 14px; line-height: 1.65; color: #1e3a8a; margin: 16px 0 24px 0; }
        .btn-container { text-align: center; margin: 28px 0; }
        .btn-action { display: inline-block; background-color: #2563eb; color: #ffffff !important; font-size: 14px; font-weight: 600; text-decoration: none; padding: 12px 28px; border-radius: 10px; }
        .footer { background-color: #f8fafc; padding: 20px 32px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="main-card">
            <div class="header">
                <span class="header-badge">Đăng ký đề tài khóa luận</span>
                <h1 class="header-title">Nexus Portal</h1>
            </div>
            <div class="body">
                <div class="notice-title">{{TITLE}}</div>
                <div class="content-box">
                    {{CONTENT}}
                </div>
                <div class="btn-container">
                    <a href="{{SYSTEM_URL}}" class="btn-action" target="_blank">Xem Chi Tiết Đề Tài</a>
                </div>
            </div>
            <div class="footer">
                Cổng Thông Tin Khóa Luận Tốt Nghiệp - Khoa CNTT (HCMUTE)<br>
                &copy; {{YEAR}} Nexus Portal. All rights reserved.
            </div>
        </div>
    </div>
</body>
</html>

name: nexus-portal

services:
  mysql_db:
    image: mysql:8.0
    container_name: nexus_mysql_db
    restart: unless-stopped
    env_file:
      - ./be/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in be/.env}
      MYSQL_DATABASE: ${DB_NAME:-nexus_db}
    volumes:
      - nexus_mysql_data:/var/lib/mysql
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in be/.env}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend_api:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: nexus_backend_api
    restart: unless-stopped
    depends_on:
      mysql_db:
        condition: service_healthy
    env_file:
      - ./be/.env
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-nexus_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-Nexus@Secure2026#Db}
      SERVER_PORT: ${SERVER_PORT:-8080}
      CONTEXT_PATH: ${CONTEXT_PATH:-}
      JWT_SECRET: ${JWT_SECRET:-9a6747f6f64535e3b5acf29c3645e4612482e16136f019f945e7a3ce8b46445b}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-*}
      SQL_INIT_MODE: ${SQL_INIT_MODE:-never}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    volumes:
      - ./be/logs:/app/logs
    networks:
      - nexus-network

  frontend_app:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: nexus_frontend_app
    restart: unless-stopped
    depends_on:
      - backend_api
    env_file:
      - ./fe/.env
    ports:
      - "${FE_PORT:-80}:80"
    networks:
      - nexus-network

networks:
  nexus-network:
    driver: bridge

volumes:
  nexus_mysql_data:
    external: true
    name: ${NEXUS_MYSQL_VOLUME:?Set NEXUS_MYSQL_VOLUME to the existing production volume}
